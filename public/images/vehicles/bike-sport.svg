<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Sport motorcycle illustration">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="body2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="55%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="chrome2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/><stop offset="50%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="shadow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity=".28"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg2)"/>
  <ellipse cx="320" cy="332" rx="235" ry="26" fill="url(#shadow2)"/>
  <!-- wheels -->
  <circle cx="158" cy="288" r="64" fill="#111827"/><circle cx="158" cy="288" r="44" fill="#1f2937"/>
  <circle cx="158" cy="288" r="26" fill="url(#chrome2)"/>
  <circle cx="486" cy="288" r="64" fill="#111827"/><circle cx="486" cy="288" r="44" fill="#1f2937"/>
  <circle cx="486" cy="288" r="26" fill="url(#chrome2)"/>
  <!-- swingarm + forks -->
  <path d="M486 288 L392 262" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
  <path d="M232 150 L166 268" stroke="url(#chrome2)" stroke-width="12" stroke-linecap="round"/>
  <!-- engine -->
  <path d="M300 226 L392 226 L400 282 L296 282 Z" fill="#475569"/>
  <rect x="306" y="234" width="80" height="11" rx="4" fill="#64748b"/>
  <rect x="306" y="250" width="80" height="11" rx="4" fill="#64748b"/>
  <!-- exhaust -->
  <path d="M392 274 Q450 282 470 258" stroke="url(#chrome2)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- fairing / body -->
  <path d="M214 190 Q248 148 300 152 L360 168 L392 208 L330 218 L250 214 Z" fill="url(#body2)"/>
  <path d="M360 168 Q430 158 470 176 L486 206 L400 214 Z" fill="url(#body2)"/>
  <path d="M232 178 Q272 160 312 168" stroke="#bfdbfe" stroke-width="5" fill="none" opacity=".6" stroke-linecap="round"/>
  <!-- seat + tail -->
  <path d="M400 176 Q456 166 494 186 Q502 198 486 202 L410 208 Z" fill="#0f172a"/>
  <path d="M470 172 Q516 164 536 186 L500 192 Z" fill="url(#body2)"/>
  <!-- windscreen + headlight -->
  <path d="M216 158 Q234 132 262 138 L250 160 Z" fill="#93c5fd" opacity=".85"/>
  <path d="M206 186 L242 176 L246 200 L210 206 Z" fill="#fef9c3"/>
  <!-- handlebar -->
  <path d="M244 154 L292 146" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
  <!-- rear shock -->
  <path d="M392 232 L420 268" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
</svg>
